<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Catalog - Zen Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/storefront.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon">Z</div>
        <div class="logo-text">Zen<span>Store</span></div>
      </a>

      <div class="header-search">
        <div class="search-input-wrapper">
          <input type="text" id="search-input" class="search-input" placeholder="Search catalog..." autocomplete="off">
          <button class="search-btn"><svg style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></button>
        </div>
        <div id="search-dropdown" class="search-results-dropdown"></div>
      </div>

      <div class="header-actions">
        <a href="shop.html" class="header-nav-link active">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span>Shop</span>
        </a>
        <a href="cart.html" class="header-nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
          <span>Cart</span>
          <div id="cart-badge" class="cart-badge-count" style="display:none;">0</div>
        </a>
        <a href="login.html" id="header-account-btn" class="header-nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>Account</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Shop Main Catalog Layout -->
  <main style="max-width:1280px; margin:2rem auto; padding:0 1.5rem; flex-grow:1;">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
      <div>
        <h1 style="font-size:1.8rem; font-weight:800;" id="catalog-heading">All Products</h1>
        <p style="color:var(--text-muted); font-size:0.9rem;" id="catalog-count-text">Showing all available items</p>
      </div>

      <!-- Sorting Control -->
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <label for="sort-select" style="font-weight:600; font-size:0.9rem; color:var(--text-muted);">Sort By:</label>
        <select id="sort-select" class="form-control form-select" style="width:auto; padding-top:0.45rem; padding-bottom:0.45rem;">
          <option value="featured">Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="rating">Customer Rating</option>
          <option value="newest">Newest Arrivals</option>
        </select>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:260px 1fr; gap:2rem; align-items:start;">

      <!-- Sidebar Filters -->
      <aside class="card" style="padding:1.5rem; position:sticky; top:90px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; border-bottom:1px solid var(--border); padding-bottom:0.75rem;">
          <h3 style="font-size:1.1rem; font-weight:700;">Filters</h3>
          <button id="clear-filters-btn" class="btn btn-outline btn-sm" style="padding:0.2rem 0.5rem; font-size:0.75rem;">Clear All</button>
        </div>

        <!-- Categories Filter -->
        <div style="margin-bottom:1.5rem;">
          <h4 style="font-size:0.9rem; font-weight:700; margin-bottom:0.75rem; text-transform:uppercase; color:var(--text-muted);">Categories</h4>
          <div id="filter-categories-list" style="display:flex; flex-direction:column; gap:0.5rem;">
            <!-- Category checkboxes rendered here -->
          </div>
        </div>

        <!-- Price Range Slider Filter -->
        <div style="margin-bottom:1.5rem;">
          <h4 style="font-size:0.9rem; font-weight:700; margin-bottom:0.75rem; text-transform:uppercase; color:var(--text-muted);">Max Price</h4>
          <input type="range" id="price-slider" min="500" max="15000" step="500" value="15000" style="width:100%; accent-color:var(--primary);">
          <div style="display:flex; justify-content:space-between; font-size:0.85rem; font-weight:600; color:var(--text-main); margin-top:0.35rem;">
            <span>₹500</span>
            <span id="price-slider-val">₹15,000</span>
          </div>
        </div>

        <!-- Rating Filter -->
        <div style="margin-bottom:1.5rem;">
          <h4 style="font-size:0.9rem; font-weight:700; margin-bottom:0.75rem; text-transform:uppercase; color:var(--text-muted);">Minimum Rating</h4>
          <div style="display:flex; flex-direction:column; gap:0.4rem;">
            <label class="checkbox-label"><input type="radio" name="rating-filter" value="0" checked> Any Rating</label>
            <label class="checkbox-label"><input type="radio" name="rating-filter" value="4.5"> 4.5★ & Above</label>
            <label class="checkbox-label"><input type="radio" name="rating-filter" value="4.0"> 4.0★ & Above</label>
          </div>
        </div>

        <!-- Stock Availability Filter -->
        <div>
          <label class="checkbox-label">
            <input type="checkbox" id="in-stock-only"> In Stock Only
          </label>
        </div>
      </aside>

      <!-- Products Grid -->
      <section>
        <div id="catalog-products-grid" class="grid grid-cols-3">
          <!-- Rendered dynamically -->
        </div>

        <!-- Empty Filter State -->
        <div id="no-products-state" class="empty-state" style="display:none;">
          <div class="empty-state-icon"><svg style="width:48px;height:48px;color:var(--text-muted);" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>
          <h3 class="empty-state-title">No matching products</h3>
          <p class="empty-state-description">Try clearing your filters or searching for another query.</p>
          <button onclick="resetFilters()" class="btn btn-primary">Reset Filters</button>
        </div>
      </section>
    </div>

  </main>

  <!-- Mobile Navigation -->
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Home</span>
    </a>
    <a href="shop.html" class="mobile-nav-item active">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span>Shop</span>
    </a>
    <a href="cart.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <span>Cart</span>
    </a>
    <a href="orders.html" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <span>Orders</span>
    </a>
    <a href="login.html" id="mobile-nav-account" class="mobile-nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Account</span>
    </a>
  </nav>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/database.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allProducts = [];
    let currentCategoryFilter = '';
    let searchQuery = '';

    function loadShopData() {
      allProducts = ZenDB.getProducts().filter(p => p.status === 'Active');
      renderCategoryFilters();
      applyFilters();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Parse URL Search Params
      const urlParams = new URLSearchParams(window.location.search);
      currentCategoryFilter = urlParams.get('category') || '';
      searchQuery = urlParams.get('search') || '';

      if (searchQuery) {
        document.getElementById('catalog-heading').textContent = `Search Results for "${searchQuery}"`;
      } else if (currentCategoryFilter) {
        const catObj = ZenDB.getCategories().find(c => c.id === currentCategoryFilter);
        if (catObj) document.getElementById('catalog-heading').textContent = catObj.name;
      }

      bindFilterEvents();
      loadShopData();

      if (typeof SupabaseClientService !== 'undefined' && SupabaseClientService.isConfigured()) {
        await ZenDB.syncFromSupabase();
        loadShopData();
      }
    });

    window.addEventListener('zenstore:db-synced', () => {
      loadShopData();
    });

    function renderCategoryFilters() {
      const catContainer = document.getElementById('filter-categories-list');
      if (!catContainer) return;

      const categories = ZenDB.getCategories();
      catContainer.innerHTML = categories.map(c => `
        <label class="checkbox-label">
          <input type="checkbox" class="cat-checkbox" value="${c.id}" ${c.id === currentCategoryFilter ? 'checked' : ''}> ${c.name}
        </label>
      `).join('');
    }

    function bindFilterEvents() {
      document.querySelectorAll('.cat-checkbox').forEach(cb => cb.addEventListener('change', applyFilters));
      
      const slider = document.getElementById('price-slider');
      slider.addEventListener('input', (e) => {
        document.getElementById('price-slider-val').textContent = Utils.formatINR(e.target.value);
        applyFilters();
      });

      document.querySelectorAll('input[name="rating-filter"]').forEach(r => r.addEventListener('change', applyFilters));
      document.getElementById('in-stock-only').addEventListener('change', applyFilters);
      document.getElementById('sort-select').addEventListener('change', applyFilters);
      document.getElementById('clear-filters-btn').addEventListener('click', resetFilters);
    }

    function applyFilters() {
      let filtered = [...allProducts];

      // 1. Search Query
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q));
      }

      // 2. Selected Categories
      const selectedCats = Array.from(document.querySelectorAll('.cat-checkbox:checked')).map(cb => cb.value);
      if (selectedCats.length > 0) {
        filtered = filtered.filter(p => selectedCats.includes(p.categoryId));
      }

      // 3. Price Filter
      const maxPrice = Number(document.getElementById('price-slider').value);
      filtered = filtered.filter(p => p.sellingPrice <= maxPrice);

      // 4. Rating Filter
      const minRating = Number(document.querySelector('input[name="rating-filter"]:checked').value);
      if (minRating > 0) {
        filtered = filtered.filter(p => p.rating >= minRating);
      }

      // 5. Stock Filter
      const inStockOnly = document.getElementById('in-stock-only').checked;
      if (inStockOnly) {
        filtered = filtered.filter(p => p.stock > 0);
      }

      // 6. Sorting
      const sortBy = document.getElementById('sort-select').value;
      if (sortBy === 'price-low') filtered.sort((a, b) => a.sellingPrice - b.sellingPrice);
      else if (sortBy === 'price-high') filtered.sort((a, b) => b.sellingPrice - a.sellingPrice);
      else if (sortBy === 'rating') filtered.sort((a, b) => b.rating - a.rating);
      else if (sortBy === 'newest') filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      renderGrid(filtered);
    }

    function renderGrid(products) {
      const grid = document.getElementById('catalog-products-grid');
      const empty = document.getElementById('no-products-state');
      const countText = document.getElementById('catalog-count-text');

      countText.textContent = `Showing ${products.length} product(s)`;

      if (products.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        grid.style.display = 'grid';
        grid.innerHTML = products.map(p => renderProductCard(p)).join('');
      }
    }

    function resetFilters() {
      document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = false);
      const slider = document.getElementById('price-slider');
      slider.value = 15000;
      document.getElementById('price-slider-val').textContent = '₹15,000';
      document.querySelector('input[name="rating-filter"][value="0"]').checked = true;
      document.getElementById('in-stock-only').checked = false;
      document.getElementById('sort-select').value = 'featured';
      searchQuery = '';
      applyFilters();
    }
  </script>
</body>
</html>
