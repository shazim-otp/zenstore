<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Tracking - Zen Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/storefront.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo-brand">
        <div class="logo-icon">Z</div>
        <div class="logo-text">Zen<span>Store</span></div>
      </a>

      <div class="header-actions">
        <a href="shop.html" class="header-nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span>Shop</span>
        </a>
        <a href="cart.html" class="header-nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
          <span>Cart</span>
          <div id="cart-badge" class="cart-badge-count" style="display:none;">0</div>
        </a>
        <a href="login.html" id="header-account-btn" class="header-nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>Account</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Orders Main Layout -->
  <main style="max-width:1280px; margin:2rem auto; padding:0 1.5rem; flex-grow:1;">
    <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:1.5rem;">My Orders & Delivery Status</h1>

    <div id="orders-list-container">
      <!-- Orders rendered dynamically -->
    </div>
  </main>

  <!-- Mobile Navigation -->
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Home</span></a>
    <a href="shop.html" class="mobile-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg><span>Shop</span></a>
    <a href="cart.html" class="mobile-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg><span>Cart</span></a>
    <a href="orders.html" class="mobile-nav-item active"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span>Orders</span></a>
    <a href="login.html" class="mobile-nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>Account</span></a>
  </nav>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/database.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderOrdersList();
    });

    function renderOrdersList() {
      const container = document.getElementById('orders-list-container');
      const user = Auth.getCurrentUser();
      const urlParams = new URLSearchParams(window.location.search);
      const highlightId = urlParams.get('id');
      
      let orders = ZenDB.getOrders();
      if (user && user.role === 'customer') {
        orders = ZenDB.getOrdersByCustomer(user.id);
      } else if (highlightId) {
        orders = orders.filter(o => o.id === highlightId);
      }

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📦</div>
            <h2 class="empty-state-title">No Orders Placed Yet</h2>
            <p class="empty-state-description">When you place an order, your tracking details and history will appear here.</p>
            <a href="shop.html" class="btn btn-primary">Start Shopping</a>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(o => {
        const isTarget = highlightId && o.id === highlightId;
        const statusClass = getStatusBadgeClass(o.orderStatus);
        const payStatusClass = o.paymentStatus === 'Paid' ? 'badge-success' : 'badge-warning';

        return `
          <div class="card" style="margin-bottom:1.5rem; overflow:hidden; ${isTarget ? 'border:2px solid var(--primary); box-shadow:0 0 15px rgba(99,102,241,0.2);' : ''}">
            <div class="card-header" style="background:var(--surface-alt); flex-wrap:wrap; gap:0.5rem;">
              <div>
                <span style="font-weight:800; font-size:1.1rem; color:var(--text-main);">Order #${o.id}</span>
                <span style="font-size:0.85rem; color:var(--text-muted); margin-left:0.75rem;">Placed on ${Utils.formatDate(o.createdAt)}</span>
              </div>
              <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
                <span class="badge ${payStatusClass}">Payment: ${o.paymentStatus || 'Unpaid'}</span>
                <span class="badge ${statusClass}">${o.orderStatus}</span>
                <span style="font-weight:800; font-size:1.1rem; color:var(--primary);">${Utils.formatINR(o.total)}</span>
              </div>
            </div>

            <div class="card-body">

              <!-- Visual Progress Timeline -->
              <div style="margin-bottom:1.5rem; padding:1rem; background:var(--light-bg); border-radius:var(--radius-md); border:1px solid var(--border);">
                <div style="font-weight:700; font-size:0.85rem; color:var(--text-muted); margin-bottom:0.75rem;">DELIVERY TIMELINE</div>
                <div style="display:flex; justify-content:space-between; position:relative;">
                  ${renderTimelineStep('Pending WhatsApp Confirmation', o.orderStatus)}
                  ${renderTimelineStep('Confirmed', o.orderStatus)}
                  ${renderTimelineStep('Processing', o.orderStatus)}
                  ${renderTimelineStep('Shipped', o.orderStatus)}
                  ${renderTimelineStep('Delivered', o.orderStatus)}
                </div>
                ${o.trackingNumber ? `
                  <div style="margin-top:0.85rem; font-size:0.85rem; font-weight:700; color:var(--primary); background:var(--primary-light); padding:0.5rem 0.85rem; border-radius:var(--radius-sm); display:inline-block;">
                    🚚 Carrier Tracking #: <strong>${o.trackingNumber}</strong>
                  </div>
                ` : ''}
              </div>

              <!-- Items -->
              <div style="display:flex; flex-direction:column; gap:0.75rem;">
                ${o.items.map(i => `
                  <div style="display:flex; align-items:center; gap:1rem;">
                    <img src="${i.image}" style="width:50px; height:50px; border-radius:var(--radius-sm); object-fit:cover; background:var(--surface-alt);">
                    <div style="flex-grow:1;">
                      <div style="font-weight:700; font-size:0.95rem;">${i.name}</div>
                      <div style="font-size:0.8rem; color:var(--text-muted);">Qty: ${i.qty} × ${Utils.formatINR(i.sellingPrice)}</div>
                    </div>
                  </div>
                `).join('')}
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    function getStatusBadgeClass(status) {
      if (status === 'Delivered') return 'badge-success';
      if (status === 'Shipped' || status === 'Out for Delivery') return 'badge-primary';
      if (status === 'Pending WhatsApp Confirmation') return 'badge-warning';
      return 'badge-secondary';
    }

    function renderTimelineStep(stepName, currentStatus) {
      const steps = ['Pending WhatsApp Confirmation', 'Confirmed', 'Processing', 'Shipped', 'Delivered'];
      const currentIdx = steps.indexOf(currentStatus);
      const stepIdx = steps.indexOf(stepName);

      const isCompleted = stepIdx <= currentIdx;
      const color = isCompleted ? 'var(--success)' : 'var(--text-light)';

      return `
        <div style="display:flex; flex-direction:column; align-items:center; flex-grow:1; text-align:center;">
          <div style="width:22px; height:22px; border-radius:50%; background:${isCompleted ? 'var(--success)' : 'var(--border)'}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:800; margin-bottom:0.35rem;">
            ${isCompleted ? '✓' : stepIdx + 1}
          </div>
          <div style="font-size:0.7rem; font-weight:700; color:${color};">${stepName === 'Pending WhatsApp Confirmation' ? 'WhatsApp' : stepName}</div>
        </div>
      `;
    }
  </script>
</body>
</html>
