<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Portal Login - Zen Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/supplier.css">
</head>
<body style="background:linear-gradient(135deg, #0F172A 0%, #064E3B 50%, #0F172A 100%); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem 1rem;">

  <div style="max-width:420px; width:100%;">

    <!-- Brand Header -->
    <div style="text-align:center; margin-bottom:2rem;">
      <div class="logo-brand" style="justify-content:center; color:#FFF; font-size:2rem;">
        <div class="logo-icon" style="background:var(--secondary);">📦</div>
        <div class="logo-text">Supplier<span style="color:var(--secondary);">Portal</span></div>
      </div>
      <p style="color:#94A3B8; font-size:0.85rem; margin-top:0.5rem;">Fulfillment & Logistics Management</p>
    </div>

    <!-- Login Card -->
    <div class="card" style="padding:2.25rem 2rem; box-shadow:var(--shadow-xl); border:1px solid rgba(255,255,255,0.1);">
      <h2 style="font-size:1.5rem; font-weight:800; margin-bottom:1.5rem; text-align:center; color:#FFF;">📦 Supplier Sign In</h2>

      <form id="supplier-login-form" onsubmit="handleSupplierLogin(event)">
        <div class="form-group">
          <label class="form-label" style="color:#CBD5E1;">Supplier Username or Email</label>
          <input type="text" id="sup-user" class="form-control" placeholder="supplier1@techcraft.in" required value="supplier1@techcraft.in">
        </div>

        <div class="form-group">
          <label class="form-label" style="color:#CBD5E1;">Password</label>
          <input type="password" id="sup-pass" class="form-control" placeholder="••••••••" required value="supplier123">
        </div>

        <button type="submit" class="btn btn-secondary btn-lg btn-block" style="margin-top:1.25rem; background:var(--secondary); color:#0F172A; font-weight:800;">
          Sign In to Supplier Portal
        </button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; border-top:1px solid var(--border); padding-top:1rem; font-size:0.8rem; color:#64748B;">
        Supplier Order Processing & Tracking System
      </div>
    </div>

  </div>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/database.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleSupplierLogin(e) {
      e.preventDefault();
      const user = document.getElementById('sup-user').value.trim();
      const pass = document.getElementById('sup-pass').value.trim();

      const res = await Auth.loginSupplier(user, pass);
      if (res && res.success) {
        setTimeout(() => {
          window.location.href = 'supplier/index.html';
        }, 500);
      } else {
        Utils.showToast(res ? res.message : 'Login failed', 'error');
      }
    }
  </script>
</body>
</html>
