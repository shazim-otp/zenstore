<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner / Admin Login - Zen Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="background:linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #0F172A 100%); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem 1rem;">

  <div style="max-width:420px; width:100%;">

    <!-- Brand Header -->
    <div style="text-align:center; margin-bottom:2rem;">
      <div class="logo-brand" style="justify-content:center; color:#FFF; font-size:2rem;">
        <div class="logo-icon" style="background:var(--primary);">Z</div>
        <div class="logo-text">Zen<span>Admin</span></div>
      </div>
      <p style="color:#94A3B8; font-size:0.85rem; margin-top:0.5rem;">Store Owner Dashboard Portal</p>
    </div>

    <!-- Login Card -->
    <div class="card" style="padding:2.25rem 2rem; box-shadow:var(--shadow-xl); border:1px solid rgba(255,255,255,0.1);">
      <h2 style="font-size:1.5rem; font-weight:800; margin-bottom:1.5rem; text-align:center; color:#FFF;">Owner Sign In</h2>

      <form id="admin-login-form" onsubmit="handleOwnerLogin(event)">
        <div class="form-group">
          <label class="form-label" style="color:#CBD5E1;">Username or Email</label>
          <input type="text" id="admin-user" class="form-control" placeholder="zeni" required value="zeni">
        </div>

        <div class="form-group">
          <label class="form-label" style="color:#CBD5E1;">Password</label>
          <input type="password" id="admin-pass" class="form-control" placeholder="••••••••" required value="zenn">
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:1.25rem;">
          Sign In to Dashboard
        </button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; border-top:1px solid var(--border); padding-top:1rem; font-size:0.8rem; color:#64748B;">
        Restricted Portal • Authorized Personnel Only
      </div>
    </div>

  </div>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/database.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleOwnerLogin(e) {
      e.preventDefault();
      const user = document.getElementById('admin-user').value.trim();
      const pass = document.getElementById('admin-pass').value.trim();

      const res = await Auth.loginOwner(user, pass);
      if (res && res.success) {
        setTimeout(() => {
          window.location.href = 'admin/index.html';
        }, 500);
      } else {
        Utils.showToast(res ? res.message : 'Login failed', 'error');
      }
    }
  </script>
</body>
</html>
