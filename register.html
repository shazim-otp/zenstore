<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account - Zen Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/storefront.css">
</head>
<body style="background:linear-gradient(135deg, #111827 0%, #31103F 50%, #111827 100%); display:flex; align-items:center; justify-content:center; padding:2rem 1rem;">

  <div style="max-width:480px; width:100%;">

    <div style="text-align:center; margin-bottom:2rem;">
      <a href="index.html" class="logo-brand" style="justify-content:center; color:#FFF; font-size:2rem;">
        <div class="logo-icon">Z</div>
        <div class="logo-text">Zen<span style="color:var(--secondary);">Store</span></div>
      </a>
      <p style="color:#94A3B8; font-size:0.9rem; margin-top:0.5rem;">Join thousands of happy shoppers across India</p>
    </div>

    <div class="card" style="padding:2rem; box-shadow:var(--shadow-xl);">
      <h2 style="font-size:1.5rem; font-weight:800; margin-bottom:1.5rem; text-align:center;">Create Customer Account</h2>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="Rahul Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address <span class="required">*</span></label>
          <input type="email" id="reg-email" class="form-control" placeholder="rahul.sharma@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210">
        </div>

        <div class="form-group">
          <label class="form-label">Password <span class="required">*</span></label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:1rem;">
          Create Account & Sign In
        </button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; border-top:1px solid var(--border); padding-top:1rem; font-size:0.9rem; color:var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight:700;">Sign In</a>
      </div>
    </div>

  </div>

  <!-- Core Scripts -->
  <script src="js/database.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const pass = document.getElementById('reg-password').value;

      const res = Auth.register(name, email, pass, phone);
      if (res.success) {
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 600);
      } else {
        Utils.showToast(res.message, 'error');
      }
    }
  </script>
</body>
</html>
