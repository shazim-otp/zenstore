<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Orders - Supplier Portal</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/supplier.css">
</head>
<body class="supplier-layout">

  <!-- Sidebar -->
  <aside class="supplier-sidebar">
    <div style="padding:1.25rem 1.5rem; border-bottom:1px solid #334155; display:flex; align-items:center; gap:0.75rem;">
      <div class="logo-icon" style="width:32px; height:32px; font-size:1.1rem; background:var(--secondary);">S</div>
      <div style="font-family:var(--font-heading); font-weight:800; font-size:1.2rem;">Supplier<span style="color:var(--secondary);">Portal</span></div>
    </div>

    <div style="padding:1rem 0.85rem; display:flex; flex-direction:column; gap:0.35rem; flex-grow:1;">
      <a href="index.html" class="sidebar-link" style="color:#94A3B8;"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Overview</span></a>
      <a href="orders.html" class="sidebar-link active" style="color:#FFF;"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg><span>Assigned Orders</span></a>
      <a href="products.html" class="sidebar-link" style="color:#94A3B8;"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg><span>Supplied Products</span></a>
      <a href="profile.html" class="sidebar-link" style="color:#94A3B8;"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>Earnings & Profile</span></a>
    </div>

    <div style="padding:1rem 1.25rem; border-top:1px solid #334155; display:flex; justify-content:space-between; align-items:center;">
      <div id="supplier-name-tag" style="font-weight:700; font-size:0.85rem;">Supplier Portal</div>
      <button onclick="Auth.logout()" class="btn-icon" style="color:#94A3B8;" title="Logout">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="supplier-main">
    <header style="background:var(--surface); border-bottom:1px solid var(--border); padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h1 style="font-size:1.5rem; font-weight:800;" id="page-title">Assigned Orders Dispatch List</h1>
        <p style="color:var(--text-muted); font-size:0.85rem;">Strict Data Isolation: Displays exclusively items assigned to your warehouse</p>
      </div>

      <button onclick="Auth.logout()" class="btn btn-outline btn-sm">Sign Out</button>
    </header>

    <div style="padding:2rem;">
      <div id="supplier-orders-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let currentSupplierId = 'SUP-101';

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireRole(['supplier'])) return;
      const user = Auth.getCurrentUser();
      if (user && user.supplierId) currentSupplierId = user.supplierId;

      const supObj = ZenDB.getSupplierById(currentSupplierId);
      if (supObj) {
        document.getElementById('supplier-name-tag').textContent = supObj.name;
        document.getElementById('page-title').textContent = `${supObj.companyName} - Assigned Orders`;
      }

      renderSupplierOrdersPage();
    });

    function renderSupplierOrdersPage() {
      const orders = ZenDB.getOrdersBySupplier(currentSupplierId);
      const container = document.getElementById('supplier-orders-list');

      if (!orders || orders.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><svg style="width:48px;height:48px;color:var(--text-muted);" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg></div><h3>No Orders Assigned Yet</h3><p style="color:var(--text-muted); font-size:0.9rem;">Orders assigned to your warehouse will appear here automatically.</p></div>`;
        return;
      }

      container.innerHTML = orders.map(o => {
        const myItems = o.items.filter(i => i.supplierId === currentSupplierId);
        const myPayout = myItems.reduce((sum, i) => sum + (i.buyPrice * i.qty), 0);
        const supStateObj = o.supplierStatus && o.supplierStatus[currentSupplierId] ? o.supplierStatus[currentSupplierId] : { status: 'Pending', trackingNumber: '' };

        const cleanPhone = (o.customerPhone || '').replace(/\D/g, '');
        const fullPhone = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;
        const itemsSummary = myItems.map(i => `${i.name} (Qty: ${i.qty})`).join(', ');
        const trkText = supStateObj.trackingNumber ? `\nTracking #: ${supStateObj.trackingNumber}` : '';
        const waConfirmMsg = `Hello ${o.customerName}, your Zen Store order #${o.id} (${itemsSummary}) has been confirmed for dispatch!${trkText}\nStatus: ${supStateObj.status}\nShipping Address: ${o.shippingAddress.house}, ${o.shippingAddress.area}, ${o.shippingAddress.city} - ${o.shippingAddress.pin}. Thank you!`;
        const waUrl = `https://api.whatsapp.com/send?phone=${fullPhone}&text=${encodeURIComponent(waConfirmMsg)}`;

        return `
          <div class="supplier-order-card">
            <div class="supplier-order-header">
              <div>
                <span style="font-weight:800; font-size:1.05rem; color:var(--text-main);">Order #${o.id}</span>
                <span style="font-size:0.85rem; color:var(--text-muted); margin-left:0.75rem;">Placed on ${Utils.formatDate(o.createdAt)}</span>
              </div>
              <div>
                <span class="status-pill ${supStateObj.status.toLowerCase()}">${supStateObj.status}</span>
              </div>
            </div>

            <div class="supplier-order-body">
              <div>
                <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted); margin-bottom:0.5rem;">ASSIGNED ITEMS</div>
                <div class="supplier-items-list">
                  ${myItems.map(i => `
                    <div class="supplier-item-row">
                      <img src="${i.image}" class="supplier-item-img">
                      <div style="flex-grow:1;">
                        <div style="font-weight:700; font-size:0.9rem;">${i.name}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">SKU: ${i.sku} | Qty: ${i.qty}</div>
                      </div>
                      <div style="font-weight:800; color:var(--success);">Buy Price: ${Utils.formatINR(i.buyPrice)}</div>
                    </div>
                  `).join('')}
                </div>

                <div style="margin-top:1rem; padding:0.85rem; background:var(--surface-alt); border-radius:var(--radius-md); font-size:0.85rem;">
                  <strong>Customer Delivery Address:</strong><br>
                  ${o.customerName} (${o.customerPhone})<br>
                  ${o.shippingAddress.house}, ${o.shippingAddress.area}, ${o.shippingAddress.city}, ${o.shippingAddress.state} - ${o.shippingAddress.pin}
                </div>
              </div>

              <!-- Right Actions Box -->
              <div style="display:flex; flex-direction:column; gap:0.85rem;">
                <div class="supplier-payout-box">
                  <span>Your Total Payout:</span>
                  <span>${Utils.formatINR(myPayout)}</span>
                </div>

                <a href="${waUrl}" target="_blank" class="btn btn-sm btn-block" style="background:#22C55E; color:#FFFFFF; font-weight:800; display:flex; align-items:center; justify-content:center; gap:0.5rem; text-decoration:none; box-shadow:0 2px 8px rgba(34,197,94,0.3);">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                  </svg>
                  <span>Confirm on WhatsApp</span>
                </a>

                <div class="tracking-input-form">
                  <label style="font-size:0.8rem; font-weight:700;">Carrier Tracking Number</label>
                  <input type="text" id="track-${o.id}" class="form-control" value="${supStateObj.trackingNumber || ''}" placeholder="e.g. BlueDart - BD884920">

                  <div style="display:flex; gap:0.5rem; margin-top:0.35rem;">
                    ${supStateObj.status === 'Pending' ? `
                      <button class="btn btn-primary btn-sm btn-block" onclick="updateOrderStatus('${o.id}', 'Accepted')">Accept Order</button>
                    ` : ''}
                    <button class="btn btn-success btn-sm btn-block" onclick="updateOrderStatus('${o.id}', 'Shipped')">Mark Shipped</button>
                    <button class="btn btn-outline btn-sm btn-block" onclick="updateOrderStatus('${o.id}', 'Delivered')">Mark Delivered</button>
                  </div>
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    function updateOrderStatus(id, status) {
      const trk = document.getElementById(`track-${id}`).value.trim() || 'TRK-' + Math.floor(100000 + Math.random() * 900000);
      ZenDB.updateSupplierFulfillment(id, currentSupplierId, {
        status: status,
        trackingNumber: trk,
        shippedAt: status === 'Shipped' ? new Date().toISOString() : null,
        deliveredAt: status === 'Delivered' ? new Date().toISOString() : null
      });
      renderSupplierOrdersPage();
      Utils.showToast(`Order #${id} updated to ${status}!`, 'success');
    }
  </script>
</body>
</html>
